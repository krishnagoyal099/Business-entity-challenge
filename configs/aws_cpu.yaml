# Local development configuration (no AWS).
# Precedence: real env vars > .env file > this YAML > code defaults.

project:
  name: business-entity-resolution
  seed: 42

paths:
  data_dir: dataset
  artifact_dir: artifacts
  output_dir: output

aws:
  use_s3: true
  region: us-east-1
  s3_bucket: ""
  s3_prefix: business-entity-resolution
  role: ""

execution:
  mode: local
  instance_type: ml.m5.xlarge
  instance_count: 1
  volume_size_gb: 40
  n_jobs: 4

data:
  train:
    source1: train_source1.tsv
    source2: train_source2.tsv
    source3: train_source3.tsv
    ground_truth: train_ground_truth.tsv
  test:
    source1: test_source1.tsv
    source2: test_source2.tsv
    source3: test_source3.tsv
    ground_truth: ""

validation:
  n_folds: 5
  stratify: true
  absent_is_zero: true        # VERIFY against official evaluator after full audit

logging:
  level: INFO
  dir: ""

audit:
  pattern_sample_rows: 100000
  top_k: 25
  unique_cap: 100000
  save_head_rows: 50

schema:                       # locked from provided data samples
  overrides:
    source1: {id: entity_id, name: business_name, address: business_address, country: country}
    source2: {id: entity_id, name: business_name, address: business_address, country: country}
    source3: {id: entity_id, name: business_name, address: business_address, country: country}
    ground_truth: {s1_id: source1_entity_id, matches: matched_entity_ids}

# Retrieval settings for the big-instance runs. `char_addr` is ON here
# (typo'd addresses); `rare` stays enabled because its score is a feature.
retrieval:
  s1_chunk_rows: 25000
  max_spread: 150000000
  normalize_part_rows: 500000
  part_target_pairs: 2000000
  missed_pair_sample: 300
  channels:
    exact: {enabled: true, k: 100, max_postings: 300}
    char_name: {enabled: true, k: 50, max_df: 0.02}
    word_name: {enabled: true, k: 30, max_df: 0.02}
    rare: {enabled: true, k: 30, max_df_abs: 1000}
    word_addr: {enabled: true, k: 50, max_df: 0.02}
    char_addr: {enabled: true, k: 30, max_df: 0.01}
